name: VTECHCarPlayVideo
options:
  bundleIdPrefix: com.vtech.demo
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  VTECHCarPlayVideo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vtech.demo.carplayvideo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''

  VTECHCarPlayVideoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VTECHCarPlayVideo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VTECHCarPlayVideo
schemes:
  VTECHCarPlayVideo:
    build:
      targets:
        VTECHCarPlayVideo: all
        VTECHCarPlayVideoUITests: [test]
    test:
      targets:
        - VTECHCarPlayVideoUITests
